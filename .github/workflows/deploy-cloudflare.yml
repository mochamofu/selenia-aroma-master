# main に入った変更を Cloudflare へ自動で反映する。
#
# いま Vercel が自動でやっていることを、Cloudflare でも同じようにする。
# 手元でコマンドを打たなくても、マージすれば公開される。
#
# 動かすには GitHub の Secrets に次の2つを登録する（登録は画面から行う）:
#   CLOUDFLARE_API_TOKEN   Cloudflare で発行するトークン
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare のアカウントID
# 手順は docs/cloudflare-migration.md を参照。

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # 画面のボタンから手動でも動かせるようにしておく。
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 壊れたものを公開しないよう、先に型と静的検査を通す。
      - run: npx tsc --noEmit
      - run: npm run lint

      - run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
