# 本番の D1 に問い合わせて、結果を実行ログに出す。
#
# 手元から本番の D1 を触るには Cloudflare のトークンが要る。トークンを
# 人手で持ち回らずに済むよう、GitHub の Secrets に置いたものを、この
# ワークフローの中だけで使う。ログに出るのは問い合わせの結果だけで、
# トークンそのものは出ない。
#
# 画面から手で SQL を貼って結果を読み上げる作業を、ここに寄せるためのもの。
# 移行が済んだら削除してよい。
#
# 使い方:
#   Actions → Query D1 → Run workflow → SQL を入れて実行 → ログを見る
#
# 必要な Secrets（画面から登録する）:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name: Query D1

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "実行する SQL（既定はテーブルの設計を全部出す）"
        required: false
        default: "SELECT name, sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf%' ORDER BY name;"
      write:
        description: "書き込みを許可する（既定は読み取りのみ）"
        type: boolean
        required: false
        default: false

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 読み取りのつもりで書き込む文を流してしまう事故を防ぐ。
      # 書き込みたいときは、実行時に write を明示的に有効にする。
      - name: 書き込む文が混じっていないか確かめる
        if: ${{ !inputs.write }}
        env:
          SQL: ${{ inputs.sql }}
        run: |
          if printf '%s' "$SQL" | grep -qiE '\b(insert|update|delete|drop|alter|create|replace|truncate|attach|pragma +[a-z_]+ *=)\b'; then
            echo "::error::読み取り以外の文が含まれています。書き込む場合は write を有効にして実行してください。"
            exit 1
          fi

      - name: D1 に問い合わせる
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SQL: ${{ inputs.sql }}
        run: npx --yes wrangler@4.127.0 d1 execute selenia-aroma --remote --json --command "$SQL"
